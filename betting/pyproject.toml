[project]
name = "wcbet"
version = "0.1.0"
description = "World Cup betting intelligence: probability modeling and value detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
wcbet = "wcbet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wcbet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
